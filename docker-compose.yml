services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: churn
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://churn:churn@db:5432/churn}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploy}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-change-me}
      METRICS_TOKEN: ${METRICS_TOKEN:-development-only-change-me}
      SEED_DATASET: ${SEED_DATASET:-official}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata: